!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Inversiones - IPR</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <img src="ipr.jpeg" alt="Logo IPR" class="logo">
    <h1>Simulador de Inversiones 💰</h1>
  </header>

  <main>
    <section class="card">
      <label>Monto a invertir en Plazo Fijo ($):</label>
      <input type="number" id="montoPlazo" placeholder="Ej: 50000">

      <label>Monto a invertir en Fondo ($):</label>
      <input type="number" id="montoFondo" placeholder="Ej: 20000">

      <label>Monto a invertir en Acciones ($):</label>
      <input type="number" id="montoAcciones" placeholder="Ej: 15000">

      <label>Monto a invertir en Cripto ($):</label>
      <input type="number" id="montoCripto" placeholder="Ej: 15000">

      <button onclick="simular()">Simular Rendimiento</button>
      <button onclick="reiniciar()" class="btn-sec">🔄 Reiniciar</button>
    </section>

    <section id="resultado" class="resultado"></section>

    <section class="charts">
      <canvas id="graficoTorta"></canvas>
      <canvas id="graficoBarras"></canvas>
    </section>
  </main>

  <footer>
    <p>© 2025 Instituto Privado Rivadavia - Proyecto académico</p>
  </footer>

  <script>
    let chartTorta = null;
    let chartBarras = null;

    function simular() {
      const montos = {
        "Plazo Fijo": parseFloat(document.getElementById("montoPlazo").value) || 0,
        "Fondo": parseFloat(document.getElementById("montoFondo").value) || 0,
        "Acciones": parseFloat(document.getElementById("montoAcciones").value) || 0,
        "Cripto": parseFloat(document.getElementById("montoCripto").value) || 0
      };

      const tipos = {
        "Plazo Fijo": {rango: [2,5], promedio: 4},
        "Fondo": {rango: [-2,8], promedio: 3},
        "Acciones": {rango: [-10,15], promedio: 5},
        "Cripto": {rango: [-20,25], promedio: 8}
      };

      let totalGanancia = 0;
      let totalInvertido = 0;
      let rendimientoData = [];
      let resultadoHTML = "";

      for (let tipo in montos) {
        if (montos[tipo] > 0) {
          const r = tipos[tipo].rango;
          const rendimiento = (Math.random() * (r[1] - r[0]) + r[0]).toFixed(2);
          const ganancia = (montos[tipo] * (rendimiento / 100)).toFixed(2);
          totalGanancia += parseFloat(ganancia);
          totalInvertido += montos[tipo];
          const clase = rendimiento >= 0 ? "positivo" : "negativo";

          rendimientoData.push(rendimiento);

          resultadoHTML += `
            <div class="inversion">
              <p><strong>${tipo}</strong></p>
              <p>Rendimiento: <span class="${clase}">${rendimiento}%</span></p>
              <p>Ganancia/Pérdida: <span class="${clase}">$${ganancia}</span></p>
              <p>Promedio esperado: ${tipos[tipo].promedio}%</p>
            </div>
          `;
        }
      }

      const totalFinal = totalInvertido + totalGanancia;
      const claseTotal = totalGanancia >= 0 ? "positivo" : "negativo";
      resultadoHTML += `
        <div class="inversion total">
          <p><strong>Total invertido:</strong> $${totalInvertido}</p>
          <p>Total Ganancia/Pérdida: <span class="${claseTotal}">$${totalGanancia.toFixed(2)}</span></p>
          <p><strong>Total final:</strong> $${totalFinal.toFixed(2)}</p>
        </div>`;

      if (totalInvertido === 0) {
        resultadoHTML = "<p>Por favor, ingresá al menos un monto para simular.</p>";
      }

      document.getElementById("resultado").innerHTML = resultadoHTML;

      // === GRAFICO DE TORTA ===
      const ctxTorta = document.getElementById("graficoTorta");
      const ctxBarras = document.getElementById("graficoBarras");

      const labels = Object.keys(montos).filter(t => montos[t] > 0);
      const valores = Object.values(montos).filter(v => v > 0);

      if (chartTorta) chartTorta.destroy();
      if (chartBarras) chartBarras.destroy();

      chartTorta = new Chart(ctxTorta, {
        type: 'pie',
        data: {
          labels,
          datasets: [{
            data: valores,
            backgroundColor: ['#FFD700', '#E6C200', '#BFA300', '#998100'],
          }]
        },
        options: {
          plugins: { legend: { labels: { color: '#fff' } } }
        }
      });

      // === GRAFICO DE BARRAS ===
      chartBarras = new Chart(ctxBarras, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Rendimiento (%)',
            data: rendimientoData,
            backgroundColor: '#FFD700'
          }]
        },
        options: {
          scales: {
            x: { ticks: { color: '#fff' } },
            y: { ticks: { color: '#fff' } }
          },
          plugins: { legend: { labels: { color: '#fff' } } }
        }
      });
    }

    function reiniciar() {
      document.querySelectorAll("input").forEach(i => i.value = "");
      document.getElementById("resultado").innerHTML = "";
      if (chartTorta) chartTorta.destroy();
      if (chartBarras) chartBarras.destroy();
    }
  </script>
</body>
</html>
